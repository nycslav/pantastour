services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: pantastour
      POSTGRES_USER: pantastour
      POSTGRES_PASSWORD: pantastour
    ports:
      - "5432:5432"
    volumes:
      - pantastour_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantastour -d pantastour"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - pantastour_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pantastour_postgres_data:
  pantastour_redis_data:

